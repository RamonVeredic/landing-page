name: linms_landingpage

services:
  web:
    image: ghcr.io/ramonveredic/linms_landingpage:latest
    container_name: linms_landingpage
    pull_policy: always
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - '${LANDING_BIND:-0.0.0.0}:${LANDING_PORT:-8085}:8080'
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
