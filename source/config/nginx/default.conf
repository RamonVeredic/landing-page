# Loaded inside LinuxServer's http context.
server {
    listen 8080;
    server_name _;
    root /app/www;
    index index.html;
    client_max_body_size 16k;
    error_page 404 /404.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/www/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 10s;
    }

    location = /tentang {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/www/tentang.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 10s;
    }

    location = /dokumentasi {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/www/dokumentasi.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 10s;
    }


    location = /404.html { internal; }

    location ^~ /asset/ {
        access_log off;
        expires 7d;
        try_files $uri =404;
    }

    location ~ /\. { return 404; }
    location ~* \.(?:php|phtml|phar|inc|conf|ini|sql|log|bak|old)$ { return 404; }
    location / { return 404; }
}
